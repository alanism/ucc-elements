<!doctype html>
<html lang="en" data-theme="ares">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Light Table — fleet · mission · operator · devices</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* =============================================================================================
   LIGHT TABLE — the Oblivion light-table grammar (thin rules with end ticks, dot rings,
   segmented gauges, cell grids, open field) applied to an AI-agent project.
   Same system as Command Deck v2:
   · ONE accent (red) = "needs you now". Everything else is neutral ink / steel.
   · Type 11 · 18 · 29 · 47 (×1.618), weights 400 / 600.  Space 4 · 8 · 16 · 24.
   · Shapes: ◇ task  ▢ blocked  ⬡ subagent  ▲ operator  ■ device  ○ phase.
   · Motion: none that loops. Numbers change when data changes.
   ============================================================================================= */
:root,[data-theme=obsidian],[data-theme=enochian]{   /* ENOCHIAN · OBSIDIAN (dark) */
  color-scheme:dark;
  --void:#050506; --p0:#0a0a0b; --p1:#0e0e10; --r1:#121215; --r2:#1c1c20; --r3:#2a2a2e;
  --line:#1f1f23; --line2:#3a3a3e; --ink:#f7f7f8; --ink2:#c9c9ce; --muted:#8a8a92; --dim:#4a4a50;
  --red:#cc0000; --red-hi:#ff4040; --on-red:#fff; --ok:255,225,205; --red-rgb:204,0,0; --cool-rgb:169,173,189;
  --easy:#fff3e6; --hard:#3a0d0d; --dot:rgba(255,255,255,.055); --selglow:rgba(169,173,189,.9);
  --case:#33373a; --case-high:#555a5c; --case-low:#35383b; --edge:#737a7e; --shine:#ffffff44; --bezel:#101214; --glass:#0b0c0d;
  --m-land:#1a1a1d; --m-water:#050506; --m-park:#202024; --m-road1:#55555c; --m-road2:#38383e; --m-road3:#2a2a2e; --m-admin:#4a4a50; --m-tint:.5; --m-hatch:.18;
}
[data-theme=white]{   /* ENOCHIAN · WHITE (light) */
  color-scheme:light;
  --void:#efeeeb; --p0:#ffffff; --p1:#fbfbfa; --r1:#f5f4f2; --r2:#ebeae7; --r3:#d8d7d3;
  --line:#e3e2de; --line2:#b9b8b3; --ink:#0e0e10; --ink2:#36363c; --muted:#66666e; --dim:#a2a2a8;
  --red:#cc0000; --red-hi:#cc0000; --on-red:#fff; --ok:30,30,34; --red-rgb:204,0,0; --cool-rgb:84,88,102;
  --easy:#ffffff; --hard:#2a0808; --dot:rgba(0,0,0,.07); --selglow:rgba(14,14,16,.25);
  --case:#eeefeb; --case-high:#f6f7f3; --case-low:#d7dad6; --edge:#b6bbb8; --shine:#ffffff; --bezel:#101214; --glass:#111315;
  --m-land:#ffffff; --m-water:#dcdad5; --m-park:#f0efeb; --m-road1:#a9a8a3; --m-road2:#c9c8c3; --m-road3:#e0dfdb; --m-admin:#9a9a9f; --m-tint:.35; --m-hatch:.07;
}
[data-theme=ares]{   /* ARES (dark navy + crimson) */
  color-scheme:dark;
  --void:#010507; --p0:#020a0e; --p1:#06151f; --r1:#081a26; --r2:#0d2432; --r3:#1b3646;
  --line:#102a38; --line2:#3c5666; --ink:#efeaea; --ink2:#cdcacb; --muted:#7f9aa8; --dim:#3d5866;
  --red:#d62832; --red-hi:#fc6253; --on-red:#fff; --ok:120,184,96; --red-rgb:214,40,50; --cool-rgb:110,150,170;
  --easy:#efeaea; --hard:#2a0d14; --dot:rgba(127,154,168,.09); --selglow:rgba(110,150,170,.9);
  --case:#1b3646; --case-high:#2a4a5c; --case-low:#132a37; --edge:#3c5666; --shine:#ffffff30; --bezel:#01070a; --glass:#020a0e;
  --m-land:#0e2633; --m-water:#020a0e; --m-park:#123040; --m-road1:#4a6878; --m-road2:#2c4a5a; --m-road3:#1b3646; --m-admin:#3c5666; --m-tint:.55; --m-hatch:.18;
}
:root{ --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --ease:cubic-bezier(.2,.7,.2,1) }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--void);color:var(--ink);font:400 11px/16px var(--sans);font-variant-numeric:tabular-nums;display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;padding:16px 24px 24px;min-height:720px}
html[data-bw="1"]{filter:grayscale(1)}
html[data-flip="1"] body{transform:rotate(180deg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
b,strong{font-weight:600}
:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.lb{font:600 11px/16px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.mono{font-family:var(--mono)} .mu{color:var(--muted)} .ink2{color:var(--ink2)} .acc{color:var(--red-hi)}
.n18{font:600 18px/24px var(--sans)} .n29{font:400 29px/32px var(--sans)} .n47{font:400 47px/48px var(--sans);letter-spacing:-.01em}
.t18{font:600 18px/24px var(--sans)}

/* ---- header ---- */
header{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;min-height:32px}
.brand{display:flex;align-items:center;gap:16px}
.sim{font:600 11px/16px var(--mono);letter-spacing:.12em;color:var(--muted);border:1px solid var(--line2);padding:0 8px;border-radius:2px}
.seg{display:flex;align-items:center;border:1px solid var(--line2);border-radius:2px;background:var(--p0)}
.seg>.lb{padding:0 8px;color:var(--muted)}
.seg button{height:24px;padding:0 8px;font:600 11px/24px var(--mono);letter-spacing:.08em;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-of-type{border-left:0}.seg>.lb+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{color:var(--ink);background:var(--r2);box-shadow:inset 0 -2px 0 var(--ink2)}
.tabs button kbd{font:400 11px var(--mono);color:var(--muted);margin-right:4px}
.sp{flex:1}
.focus{display:none;align-items:center;gap:8px;height:24px;padding:0 4px 0 8px;border:1px solid var(--ink2);border-radius:2px}
.focus.on{display:flex}.focus button{width:20px;height:20px;display:grid;place-items:center}

/* ---- screens ---- */
main{min-height:0;position:relative;background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:16px 16px;background-position:-8px -8px}
.screen{display:none;height:100%;min-height:0;gap:16px}
.screen.on{display:grid}
@media (prefers-reduced-motion:no-preference){.screen.on{animation:fade .18s var(--ease) both}}
@keyframes fade{from{opacity:0}}
/* rule header (Oblivion): label · value over a hairline with end ticks */
.rh{position:relative;display:flex;align-items:baseline;gap:8px;min-height:24px;padding:0 0 8px;margin-bottom:8px;border-bottom:1px solid var(--line2)}
.rh::before,.rh::after{content:"";position:absolute;bottom:-4px;width:1px;height:7px;background:var(--line2)}
.rh::before{left:0}.rh::after{right:0}
.rh>.lb:first-child{color:var(--ink2)}.rh .r{margin-left:auto;color:var(--muted)}
.blk{display:flex;flex-direction:column;min-width:0;min-height:0}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:0 8px;margin:0}
dl.kv dt{font:600 11px/24px var(--mono);letter-spacing:.12em;color:var(--muted)}
dl.kv dd{margin:0;text-align:right;font:400 11px/24px var(--mono);color:var(--ink2)}
dl.kv dd.acc{color:var(--red-hi)}
.btn{height:32px;padding:0 16px;border:1px solid var(--line2);border-radius:2px;font:600 11px/30px var(--mono);letter-spacing:.12em;color:var(--ink2);white-space:nowrap}
.btn:hover{border-color:var(--ink2);color:var(--ink)}
.btn.p{background:var(--ink);border-color:var(--ink);color:var(--void)}
.btn.s{height:24px;padding:0 8px;line-height:22px}
.btn.w{background:var(--red);border-color:var(--red-hi);color:var(--on-red)}
.btn[disabled]{opacity:.4;cursor:default}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{height:24px;padding:0 8px;border:1px solid var(--line2);border-radius:2px;font:600 11px/22px var(--mono);letter-spacing:.08em;color:var(--muted)}
.chip:hover{color:var(--ink)}.chip[aria-pressed=true]{color:var(--ink);background:var(--r2);border-color:var(--ink2)}
.chip b{font-weight:400;margin-left:4px}
.chip.acc{color:var(--red-hi);border-color:var(--red-hi)}
.empty{color:var(--muted);padding:8px 0}.empty b{display:block;color:var(--ink2)}
svg{display:block;overflow:visible}
svg text{font:400 11px/16px var(--mono);fill:var(--muted);letter-spacing:.06em}
svg text.k{font-weight:600;fill:var(--ink2);letter-spacing:.12em}
svg text.t{fill:var(--ink2)} svg text.big{font:400 47px var(--sans);fill:var(--ink);letter-spacing:-.01em} svg text.mid{font:400 29px var(--sans);fill:var(--ink)}
.hit{fill:transparent;cursor:pointer}
.sel-ring{fill:none;stroke:var(--ink);stroke-width:1}

/* ================= FLEET ================= */
#s-fleet{grid-template-columns:264px minmax(0,1fr)}
.rail{display:flex;flex-direction:column;gap:16px;min-height:0;overflow:auto}
.cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));min-width:0;min-height:0}
.mc{display:flex;flex-direction:column;gap:12px;min-width:0;padding:0 16px;border-left:1px solid var(--line);position:relative}
.mc.sel{background:linear-gradient(180deg,rgba(var(--cool-rgb),.10),transparent 40%)}
.mc.sel::before{content:"";position:absolute;left:-1px;right:0;top:0;height:2px;background:var(--ink)}
.mc.dim>*:not(.mch){opacity:.45}
.mch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"rr pv tc" "md md md";gap:0 8px;align-items:center;min-height:48px;padding:8px 0;border-bottom:1px solid var(--line2);position:relative;width:100%}
.mch::before,.mch::after{content:"";position:absolute;bottom:-4px;width:1px;height:7px;background:var(--line2)}.mch::before{left:0}.mch::after{right:0}
.mch>.n29{grid-area:rr}.mch .pv{grid-area:pv;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mch .md{grid-area:md;overflow-wrap:anywhere}
.mch .tc{grid-area:tc;display:flex;flex-direction:column;align-items:flex-end}
.mch:hover .n29{color:var(--ink)}
.plate{display:flex;flex-direction:column;align-items:center;gap:4px}
.plate .lb{white-space:nowrap}
.ig{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);justify-items:center;grid-template-areas:"ri cx ro" "sl cx sr";gap:8px 8px;align-items:start}
.ig .ri{grid-area:ri}.ig .ro{grid-area:ro}.ig .cx{grid-area:cx}.ig .sl{grid-area:sl}.ig .sr{grid-area:sr}
.ring{display:flex;flex-direction:column;align-items:center;gap:0}
.ig dl.kv dt,.ig dl.kv dd{line-height:20px}
.ig dl.kv{grid-template-columns:1fr}.ig dl.kv dt{line-height:16px}.ig dl.kv dd{text-align:left;line-height:16px;margin-bottom:4px;color:var(--ink)}
.ig .sr dl.kv dd,.ig .sr dl.kv dt{text-align:right}.ig .sl,.ig .sr{justify-self:stretch}
.ctxb{display:flex;align-items:center;justify-content:center;gap:0;height:32px;border:1px solid var(--line2);border-radius:2px;margin:0 auto;min-width:120px}
.ctxb span{padding:0 12px}.ctxb span:first-child{border-right:1px solid var(--line2);color:var(--ink2)}
.ctxb.hot{border-color:var(--red-hi)}.ctxb.hot span:last-child{color:var(--red-hi)}.ctxb.hot span:first-child{border-color:var(--red-hi)}
.amx{display:flex;flex-direction:column;align-items:center;gap:4px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tlist button{display:grid;grid-template-columns:24px 16px minmax(0,1fr) auto;gap:4px;align-items:center;width:100%;height:24px;border-bottom:1px solid var(--line);padding:0 2px}
.tlist button:hover{background:var(--r1)}.tlist button[aria-pressed=true]{background:var(--r2);box-shadow:inset 2px 0 0 var(--ink)}
.tlist .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.tlist .st{font:400 11px var(--mono);color:var(--muted)}.tlist .st.acc{color:var(--red-hi)}
.roster{display:flex;flex-direction:column}
.ar{display:grid;grid-template-columns:16px 32px 40px 24px minmax(0,1fr);gap:4px;align-items:center;height:24px;border-bottom:1px solid var(--line)}.ar:hover{background:var(--r1)}.ar .lb{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.io{display:flex;flex-direction:column;gap:4px;margin-top:auto}
.bars{display:flex;align-items:flex-end;gap:2px;height:16px}
.bars i{flex:1;background:var(--ink2);min-height:1px}.bars.o i{background:var(--muted)}
.key{margin-top:auto}.kr{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:center;min-height:32px}
.alert{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.alert .lb{color:var(--red-hi)}.alert .mu{grid-column:1}
.share{display:flex;height:12px;gap:2px}.share i{display:block;height:100%;background:var(--ink2)}
.share i:nth-child(2n){background:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:8px}.segs i{background:var(--r2)}.segs i.on{background:var(--ink2)}.segs i.on.hot{background:var(--red-hi)}

/* ================= MISSION ================= */
#s-mission{grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:minmax(0,1.2fr) minmax(0,1fr)}
.inst{display:flex;flex-direction:column;min-width:0;min-height:0}
.inst .plot{flex:1;min-height:0;position:relative}
.inst .ro{display:flex;gap:4px 16px;flex-wrap:wrap;align-items:baseline;padding-top:8px;min-height:40px;color:var(--muted);flex:none}
.inst .ro b{font-weight:600;color:var(--ink2)} .inst .ro b.acc{color:var(--red-hi)}
.inst .say{color:var(--ink2);max-width:640px}
#i-batch{grid-column:1/5}#i-journey{grid-column:5/10}#i-sum{grid-column:10/13}#i-due{grid-column:1/6}#i-cone{grid-column:6/13}
.sumclock{padding:8px 0 16px}
.tcard{border:1px solid var(--line2);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tcard .row{display:flex;align-items:center;gap:8px}
.pill{margin-left:auto;font:600 11px/16px var(--mono);letter-spacing:.08em;padding:0 8px;border:1px solid var(--line2);border-radius:2px;color:var(--ink2);white-space:nowrap}
.pill.acc{color:var(--red-hi);border-color:var(--red-hi)}
.agrow{display:flex;align-items:center;gap:8px;min-height:24px}

/* ================= OPERATOR ================= */
#s-operator{grid-template-columns:264px minmax(0,1fr) 224px}
.opcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:start}
.av{width:96px;height:96px;border:1px solid var(--line2);position:relative;overflow:hidden;background:var(--r1)}
.av img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.av svg{width:100%;height:100%}
.av::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(var(--cool-rgb),.10) 0 1px,transparent 1px 3px);pointer-events:none}
.wave{display:flex;align-items:center;gap:1px;height:40px}
.wave i{flex:1;background:var(--ink2);min-height:1px}
.cnt{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:32px;border-bottom:1px solid var(--line)}
.cnt .n18{text-align:right}.cnt.acc .n18,.cnt.acc .lb{color:var(--red-hi)}
#mapP{display:flex;flex-direction:column;min-width:0;min-height:0}
#mapBox{position:relative;flex:1;min-height:320px;border:1px solid var(--line2);overflow:hidden;background:var(--m-land)}
#map{position:absolute;inset:0}
#mapOv{position:absolute;inset:0;pointer-events:none;z-index:2}
#mapTint{position:absolute;inset:0;pointer-events:none;z-index:1;background:var(--m-land);opacity:0;mix-blend-mode:color}
#mapBox[data-style=sat] #mapTint{opacity:var(--m-tint)}
#mapMsg{position:absolute;left:16px;top:16px;z-index:3;max-width:360px;padding:8px 16px;border:1px solid var(--line2);background:var(--p0);display:none}
#mapMsg.on{display:block}
.mlegend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;min-height:32px;color:var(--muted);padding-top:8px}
.mlegend span{display:inline-flex;align-items:center;gap:4px}
.mk{display:flex;align-items:center;gap:4px;font:600 11px/16px var(--mono);letter-spacing:.08em;color:var(--ink);cursor:pointer;white-space:nowrap;text-shadow:0 0 3px var(--m-land),0 0 3px var(--m-land)}
.mk svg{flex:none}.mk.dim{opacity:.35}.mk.sel{text-decoration:underline;text-underline-offset:3px}
.mapboxgl-ctrl-attrib,.mapboxgl-ctrl-attrib a{font:400 11px/16px var(--mono)!important}
.feeds .row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:24px}
.feeds i.d{display:block;width:8px;height:8px;border-radius:50%;border:1px solid var(--ink2)}.feeds i.d.on{background:var(--ink2)}
.rot{display:flex;align-items:center;gap:8px}
.rot .btn{width:40px;padding:0;text-align:center}

/* ================= DEVICES ================= */
#s-devices{grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:minmax(0,1fr) 96px}
#d-schem{grid-column:1/6}#d-diag{grid-column:6/9}#d-table{grid-column:9/13}#d-idents{grid-column:1/13}
.codes{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;padding:8px 0 8px}
.codes>div{display:flex;flex-direction:column}
.schem{position:relative;flex:1;min-height:200px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"a . b" "dv dv dv" "c . d";gap:8px 0}
.schem .dv{grid-area:dv;display:grid;place-items:center;min-width:0;min-height:0}
.schem .c1{grid-area:a}.schem .c2{grid-area:b;text-align:right}.schem .c3{grid-area:c}.schem .c4{grid-area:d;text-align:right}
.schem .lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.callout{position:relative;font:600 11px/16px var(--mono);letter-spacing:.08em;color:var(--ink2);white-space:nowrap;padding:0 0 4px;border-bottom:1px solid var(--line2);min-width:0}
.callout::after{content:"";position:absolute;bottom:-1px;width:32px;border-bottom:1px dashed var(--line2)}.c1::after,.c3::after{left:100%}.c2::after,.c4::after{right:100%}
.callout span{display:block;font-weight:400;color:var(--muted)}
.load{display:flex;align-items:flex-end;gap:2px;height:48px}
.load i{flex:1;background:var(--ink2);min-height:1px}.load i.hi{background:var(--ink)}
.lvl{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.lvl span{height:24px;border:1px solid var(--line2);display:grid;place-items:center;font:600 11px var(--mono);letter-spacing:.06em;color:var(--muted)}
.lvl span.on{background:var(--r2);color:var(--ink);border-color:var(--ink2)}
.fuel{display:grid;grid-template-columns:72px minmax(0,1fr) 104px;gap:8px;align-items:center;min-height:24px}
.fuel .segs{height:10px}
.fuel .v{text-align:right;font:400 11px var(--mono);color:var(--ink2)}.fuel .v.acc{color:var(--red-hi)}
.tools{display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
.tools i{height:12px;border:1px solid var(--line2)}.tools i.ok{background:var(--ink2);border-color:var(--ink2)}.tools i.err{background:var(--red);border-color:var(--red-hi)}
.tools i.run{background:repeating-linear-gradient(135deg,var(--ink2) 0 1px,transparent 1px 4px);border-color:var(--ink2)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start;overflow:auto;min-height:0;flex:1}
.tile{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto auto;gap:4px 8px;padding:8px;border:1px solid var(--line2);border-radius:2px;text-align:left;min-height:104px;align-content:start}
.tile:hover{border-color:var(--ink2)}.tile[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tile.need{border-color:var(--red-hi)}.tile.need[aria-pressed=true]{box-shadow:inset 0 0 0 1px var(--red-hi)}
.tile.off{opacity:.3}
.tile .top{grid-column:1/3;display:flex;justify-content:space-between;color:var(--muted)}
.tile .id{font:400 29px/32px var(--sans);color:var(--ink)}
.tile .rings{display:flex;gap:4px;align-items:center;grid-row:2;grid-column:2}

/* ---------- actions (all undoable) ---------- */
function toast(msg,undo=true){ $("#toastMsg").textContent=msg; $("#toastUndo").style.display=undo?"":"none"; const t=$("#toast"); t.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("on"),5000); }
function act(id,kind){ const a=byA(id); if(!a) return; const prev={...a};
  if(kind==="compact"){ const m=byM(a.r); a.ctx=Math.round(m.window*.28); toast(`${a.id} compacted: context ${pct(prev.ctx/m.window)} → ${pct(a.ctx/m.window)}`); }
  else if(kind==="retry"){ a.status="running"; a.last=0; a.tools=a.tools.replace(/0$/,"1")+"2"; toast(`${a.id} retried · running`); }
  else if(kind==="budget"){ a.budget=Math.round(a.budget*1.25); toast(`${a.id} budget ${fk(prev.budget)} → ${fk(a.budget)}`); }
  else if(kind==="pause"){ a.status="paused"; toast(`${a.id} paused`); }
  else if(kind==="resume"){ a.status="running"; a.last=0; toast(`${a.id} resumed`); }
  else if(kind==="lvl+"||kind==="lvl-"){ a.lvl=clamp(a.lvl+(kind==="lvl+"?1:-1),0,3); if(a.lvl===prev.lvl) return; toast(`${a.id} reasoning ${LV[prev.lvl]} → ${LV[a.lvl]}`); }
  H.push(()=>Object.assign(a,prev)); render(); }
function undo(){ const f=H.pop(); if(!f){ toast("Nothing to undo.",false); return; } f(); toast("Undone.",false); render(); }

    s+=`<text x="${x+10}" y="${b===1?Hh-2:Hh-18}" text-anchor="middle">${a?a.id:""}</text>`; }
  const ty=Hh-32-T.ctx*n*sh; s+=`<line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--muted)" stroke-dasharray="2 2"/>`;
  return s+`</svg>`; }

  return s+`</svg>`; }

let BATCH=null; function buildBatch(){ const {total,done,running,failed}=CFG.batch; BATCH=[...Array(total)].map((_,i)=> i<done?"d": i<done+running?"p":"q"); failed.forEach(i=>BATCH[i]="f"); }
function batchRing(w,h){ const c=Math.min(w,h)/2, cx=w/2, cy=h/2, R=c-16, n=BATCH.length, cnt={d:0,p:0,f:0,q:0}; BATCH.forEach(s=>cnt[s]++);
  const frac=(cnt.d+cnt.f)/n, a0=-Math.PI/2, arc=(r,a,b)=>{ const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(b),y2=cy+r*Math.sin(b); return `M${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 ${b-a>Math.PI?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };

  BATCH.forEach((st,i)=>{ const a=a0+(i+.5)/n*2*Math.PI, r1=R-26, r2=R-(st==="f"?40:34), col=st==="d"?"var(--ink2)":st==="p"?"var(--ink)":st==="f"?"var(--red-hi)":"var(--line2)";
    s+=`<line x1="${(cx+r1*Math.cos(a)).toFixed(1)}" y1="${(cy+r1*Math.sin(a)).toFixed(1)}" x2="${(cx+r2*Math.cos(a)).toFixed(1)}" y2="${(cy+r2*Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="${st==="f"?2.5:1.25}"/>`; });

  s+=`<text class="big" x="${cx}" y="${cy+8}" text-anchor="middle">${cnt.d}</text><text x="${cx}" y="${cy+32}" text-anchor="middle">OF ${n} EXPORTS</text>`;
  return {svg:s+`</svg>`, cnt}; }
function journeyRadial(w,h){ const cx=w/2, cy=h/2, R=Math.max(120,Math.min(w/2-72,h/2-24)), n=CFG.phases.length, gap=.03, live=CFG.livePhase, sec=2*Math.PI/n, a0=-Math.PI/2;
  const arc=(r1,r2,a,b)=>{ const p=(r,t)=>`${(cx+r*Math.cos(t)).toFixed(1)} ${(cy+r*Math.sin(t)).toFixed(1)}`; return `M${p(r2,a)}A${r2} ${r2} 0 0 1 ${p(r2,b)}L${p(r1,b)}A${r1} ${r1} 0 0 0 ${p(r1,a)}Z`; };

    const ts=TASKS.filter(t=>t.ph===i); ts.forEach((t,j)=>{ const ta=a+(j+1)/(ts.length+1)*(b-a), r=R*(.30+(5-t.diff)/4*.52), x=cx+r*Math.cos(ta), y=cy+r*Math.sin(ta);

  const hub=Math.max(R*.22,44); s+=`<circle cx="${cx}" cy="${cy}" r="${hub}" fill="var(--void)" stroke="var(--line2)"/><text class="mid" x="${cx}" y="${cy+2}" text-anchor="middle">${pad2(live+1)}/${pad2(n)}</text><text class="k" x="${cx}" y="${cy+20}" text-anchor="middle">${lp.n}</text>`;

  return s+`</svg>`; }
function duePressure(w,h){ const x0=48, B=24, cy=(h-B)/2, rx=w-x0-48, ry=cy-16, open=TASKS.filter(t=>t.status!=="done"), f=d=>Math.sqrt(Math.min(d,14)/14);
